# Drop-in для nginx: кладётся рядом с другими сайтами.
#   /etc/nginx/conf.d/recollect.conf
#   или /etc/nginx/sites-enabled/recollect.conf
#
# Не использует default_server — остальные vhost продолжают работать.
# Перед включением замените server_name на свой хост.
# Recollect должен слушать 127.0.0.1:8080.

upstream recollect_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Формат без query string, чтобы токен из ?token= не попадал в лог.
log_format recollect_access '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" rt=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name recollect.example.com;

    access_log /var/log/nginx/recollect.access.log recollect_access;
    error_log  /var/log/nginx/recollect.error.log;

    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://recollect_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Saymon-Token $http_x_saymon_token;
        proxy_set_header Authorization $http_authorization;
    }
}

