# Вставка в существующий server { } того хоста, где уже крутится сайт.
# Не отдельный vhost: путь /recollect/... не пересекается с остальными location.
#
#   include /etc/nginx/snippets/recollect.location.conf;
#
# Или скопируйте блок location внутрь server.
# Recollect слушает 127.0.0.1:8080 и сам понимает префикс /recollect.

location = /recollect {
    return 308 /recollect/;
}

location /recollect/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Saymon-Token $http_x_saymon_token;
    proxy_set_header Authorization $http_authorization;

    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}
